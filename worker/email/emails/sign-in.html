<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office" lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>{{subject}}</title>
  <!--[if mso]>
  <xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml>
  <style>
    table, td, div, p, a, span { font-family: Arial, Helvetica, sans-serif !important; }
    table { border-collapse: collapse; }
  </style>
  <![endif]-->
  <style>
    html, body { margin: 0 !important; padding: 0 !important; height: 100% !important; width: 100% !important; }
    * { -ms-text-size-adjust: 100%; -webkit-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt !important; mso-table-rspace: 0pt !important; }
    table { border-spacing: 0 !important; border-collapse: collapse !important; table-layout: fixed !important; margin: 0 auto !important; }
    img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; display: block; }
    a { text-decoration: none; }
    a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; }
    u + #body a { color: inherit; text-decoration: none; }
    .card-title a { color: #14161a !important; }

    @media screen and (max-width: 600px) {
      .wrapper { width: 100% !important; }
      .pad { padding-left: 20px !important; padding-right: 20px !important; }
      .desk { display: none !important; }
      .mob { display: block !important; max-height: none !important; overflow: visible !important; }
      /* the hero's phone buttons: stacked, full width, 40px, 16px, no border, light one on a faint wash */
      .btn-table { width: 100% !important; }
      .btn-cell { display: block !important; width: 100% !important; padding: 0 0 12px 0 !important; }
      .btn-cell:last-child { padding-bottom: 0 !important; }
      .btn { display: block !important; width: 100% !important; box-sizing: border-box !important; height: 40px !important; line-height: 40px !important; font-size: 16px !important; font-weight: 500 !important; padding: 0 8px !important; border: 0 !important; }
      .btn-light { background-color: #f5f5f5 !important; }
      .greet { font-size: 22px !important; }
      .copy { font-size: 16px !important; }
    }
  </style>
</head>
<body id="body" style="margin:0;padding:0;background-color:#f2f2f2;word-spacing:normal;">
<div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;color:#f2f2f2;">{{preheader}}&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;</div>
<center role="article" aria-roledescription="email" lang="pt-PT" style="width:100%;background-color:#f2f2f2;">
<!--[if mso]><table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" align="center"><tr><td><![endif]-->
<table role="presentation" class="wrapper" border="0" cellpadding="0" cellspacing="0" width="600" align="center" style="width:100%;max-width:600px;background-color:#ffffff;">
<tr>
      <td bgcolor="#000000" style="padding:0;background-color:#000000;line-height:0;font-size:0;">
        <a href="https://fonteslabs.com" target="_blank" style="display:block;line-height:0;font-size:0;text-decoration:none;color:#ffffff;">
          <img src="https://api.fonteslabs.com/email-assets/header.png" width="600" alt="{{brand}}" style="width:100%; max-width:600px;height:auto;display:block;border:0;color:#ffffff;background-color:#000000;">
        </a>
      </td>
    </tr>
<tr><td class="pad" style="padding:44px 34px 8px 34px;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#14161a;">

<p class="copy" style="margin:0 0 24px 0;font-size:17px;line-height:26px;text-align:left;">{{body}}</p>
<p style="font-size:14px;line-height:20px;color:#6b6f76;margin:0 0 10px">{{action}}</p><p style="font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:36px;line-height:48px;letter-spacing:8px;font-weight:700;color:#14161a;background-color:#f5f5f5;border:1px solid #cad0d9;padding:18px 12px;text-align:center;margin:0">{{code}}</p>
<p class="copy" style="margin:24px 0 0 0;font-size:17px;line-height:26px;text-align:left;">{{expiry}}</p>
<p class="copy" style="margin:24px 0 0 0;font-size:17px;line-height:26px;text-align:left;">{{footer}}</p>
</td></tr>
<tr><td class="pad" align="right" style="padding:28px 34px 40px 34px;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:17px;line-height:24px;font-weight:700;color:#14161a;text-align:right;">{{signoff}}</td></tr>
<tr>
      <td bgcolor="#000000" style="padding:0;background-color:#000000;line-height:0;font-size:0;">
        <img src="https://api.fonteslabs.com/email-assets/footer.png" width="600" alt="{{brand}}" style="width:100%; max-width:600px;height:auto;display:block;border:0;color:#ffffff;background-color:#000000;">
      </td>
    </tr>
</table><!--[if mso]></td></tr></table><![endif]-->
</center></body></html>
